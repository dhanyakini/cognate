[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognate"
version = "0.1.0"
description = "Kannada–Telugu cognate / false-friend candidate mining"
requires-python = ">=3.10"
dependencies = [
  "pyiwn",
  "aksharamukha",
  "pandas",
  "PyYAML",
  "scikit-learn",
  "joblib",
]

[project.optional-dependencies]
dev = ["pytest"]
mt = ["deep-translator", "nltk"]
phonetic = ["lingpy"]
semantic = ["sentence-transformers"]
ml = ["scikit-learn", "joblib"]
app = ["streamlit>=1.61"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
