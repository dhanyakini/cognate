[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognate"
version = "0.1.0"
description = "Kannada–Telugu cognate / false-friend candidate mining"
requires-python = ">=3.10"
dependencies = [
  "pyiwn",
  "aksharamukha",
  "pandas",
  "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
